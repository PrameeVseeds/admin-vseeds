<div class="confirm-content">
  <div class="icon-wrapper">
    <lucide-icon [name]="data.iconName || 'alert-triangle'" [size]="32"></lucide-icon>
  </div>
  <h2>{{ data.title || 'Confirm Action' }}</h2>
  <p>{{ data.description || 'Are you sure you want to proceed?' }}</p>

  <div class="modal-footer">
    <button nz-button class="btn-cancel" (click)="onCancel()">
      {{ data.cancelText || 'Cancel' }}
    </button>
    <button nz-button class="btn-confirm" (click)="onConfirm()">
      {{ data.confirmText || 'Confirm' }}
    </button>
  </div>
</div>
