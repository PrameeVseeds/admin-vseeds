<div class="login-card">
  <!-- Header -->
  <header class="login-header">
    <div class="login-logo">
      <div class="login-logo-image">
        <img src="assets/images/logo/logo.png" alt="VSEEDS" class="dark-logo" />
        <img src="assets/images/logo/logoGreen.png" alt="VSEEDS" class="light-logo" />
      </div>
      <span class="login-logo-badge">Admin Console</span>
    </div>

    @if (!submitted()) {
      <h1 class="login-title">Reset Password</h1>
      <p class="login-subtitle">Secure your management console account.</p>
    } @else {
      <div class="fp-icon-circle fp-icon-circle--success">
        <lucide-icon name="check-check" [size]="32"></lucide-icon>
      </div>
      <h1 class="login-title">Reset Complete!</h1>
      <p class="login-subtitle">Your security credentials have been updated.</p>
    }
  </header>

  @if (!submitted()) {
    <form nz-form [formGroup]="form" (ngSubmit)="submit()" nzLayout="vertical">
      <div nz-row [nzGutter]="[16, 16]">
        <div nz-col nzSpan="24">
          <nz-form-item>
            <nz-form-control [nzErrorTip]="pwErr">
              <app-float-label label="New Password">
                <nz-input-group [nzPrefix]="lockIcon" [nzSuffix]="eyeBtn1">
                  <input
                    nz-input
                    formControlName="password"
                    id="password"
                    [type]="showPassword() ? 'text' : 'password'"
                    placeholder=" "
                  />
                </nz-input-group>
              </app-float-label>
              <ng-template #lockIcon>
                <lucide-icon
                  name="lock"
                  [size]="18"
                  class="text-[var(--text-disabled)]"
                ></lucide-icon>
              </ng-template>
              <ng-template #eyeBtn1>
                <button
                  type="button"
                  aria-label="Toggle password visibility"
                  class="flex items-center border-none bg-transparent text-[var(--text-disabled)] cursor-pointer p-0 hover:text-[var(--text-secondary)]"
                  (click)="togglePassword()"
                >
                  <lucide-icon
                    [name]="showPassword() ? 'eye-off' : 'eye'"
                    [size]="16"
                  ></lucide-icon>
                </button>
              </ng-template>
              <ng-template #pwErr>
                <app-form-error [control]="form.controls.password" label="Password" />
              </ng-template>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col nzSpan="24">
          <nz-form-item>
            <nz-form-control [nzErrorTip]="confirmErr">
              <app-float-label label="Confirm Password">
                <nz-input-group [nzPrefix]="lockIcon2" [nzSuffix]="eyeBtn2">
                  <input
                    nz-input
                    formControlName="confirmPassword"
                    id="confirmPassword"
                    [type]="showConfirm() ? 'text' : 'password'"
                    placeholder=" "
                  />
                </nz-input-group>
              </app-float-label>
              <ng-template #lockIcon2>
                <lucide-icon
                  name="lock"
                  [size]="18"
                  class="text-[var(--text-disabled)]"
                ></lucide-icon>
              </ng-template>
              <ng-template #eyeBtn2>
                <button
                  type="button"
                  aria-label="Toggle password visibility"
                  class="flex items-center border-none bg-transparent text-[var(--text-disabled)] cursor-pointer p-0 hover:text-[var(--text-secondary)]"
                  (click)="toggleConfirm()"
                >
                  <lucide-icon [name]="showConfirm() ? 'eye-off' : 'eye'" [size]="16"></lucide-icon>
                </button>
              </ng-template>
              <ng-template #confirmErr>
                <app-form-error [control]="form.controls.confirmPassword" label="Password" />
              </ng-template>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col nzSpan="24">
          <button nz-button nzType="primary" nzBlock [nzLoading]="loading()" type="submit">
            Reset Password
          </button>
        </div>
      </div>
    </form>
  } @else {
    <div class="mb-4">
      <button nz-button nzType="primary" nzBlock routerLink="/auth/login">Go to Sign In</button>
    </div>
  }

  <div class="mt-8 text-center border-t border-[var(--border-base)] pt-5">
    <a routerLink="/auth/login" class="fp-back-link">
      <lucide-icon name="arrow-left" [size]="14"></lucide-icon>
      <span>Back to Sign In</span>
    </a>
  </div>
</div>
