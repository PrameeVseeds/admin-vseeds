<div class="login-card">
  <!-- Header -->
  <header class="login-header">
    <div class="login-logo">
      <div class="login-logo-image">
        <img src="assets/images/logo/logo.png" alt="VSEEDS" class="dark-logo" />
        <img src="assets/images/logo/logoGreen.png" alt="VSEEDS" class="light-logo" />
      </div>
      <span class="login-logo-badge">Admin Console</span>
    </div>

    @if (!submitted()) {
      <h1 class="login-title">Forgot Password?</h1>
      <p class="login-subtitle">We'll send you a secure recovery link.</p>
    } @else {
      <div class="fp-icon-circle fp-icon-circle--success">
        <lucide-icon name="check-circle" [size]="32"></lucide-icon>
      </div>
      <h1 class="login-title">Check Your Email</h1>
      <p class="login-subtitle">A reset link has been sent to your inbox.</p>
    }
  </header>

  @if (!submitted()) {
    <form nz-form [formGroup]="form" (ngSubmit)="submit()" nzLayout="vertical">
      <div nz-row [nzGutter]="[16, 16]">
        <div nz-col nzSpan="24">
          <nz-form-item>
            <nz-form-control [nzErrorTip]="emailErr">
              <app-float-label label="Email Address">
                <nz-input-group [nzPrefix]="mailIcon">
                  <input
                    nz-input
                    formControlName="email"
                    id="email"
                    placeholder=" "
                    autocomplete="email"
                  />
                </nz-input-group>
              </app-float-label>
              <ng-template #mailIcon>
                <lucide-icon
                  name="mail"
                  [size]="18"
                  class="text-[var(--text-disabled)]"
                ></lucide-icon>
              </ng-template>
              <ng-template #emailErr>
                <app-form-error [control]="form.controls.email" label="Email" />
              </ng-template>
            </nz-form-control>
          </nz-form-item>
        </div>

        <div nz-col nzSpan="24">
          <button nz-button nzType="primary" nzBlock [nzLoading]="loading()" type="submit">
            Send Reset Link
          </button>
        </div>
      </div>
    </form>
  } @else {
    <div class="fp-resend">
      <button nz-button nzType="primary" nzBlock (click)="submitted.set(false)">Send Again</button>
    </div>
  }

  <div class="mt-8 text-center border-t border-[var(--border-base)] pt-5">
    <a routerLink="/auth/login" class="fp-back-link">
      <lucide-icon name="arrow-left" [size]="14"></lucide-icon>
      <span>Back to Sign In</span>
    </a>
  </div>
</div>
