<div
  class="bg-[var(--bg-component)] rounded-2xl border border-[var(--border-base)] shadow-sm overflow-hidden"
>
  <div class="px-6 py-4 border-b border-[var(--border-base)]">
    <div class="flex items-center gap-2">
      <lucide-icon name="key-round" [size]="18" class="text-amber-500"></lucide-icon>
      <h3 class="text-base font-bold text-[var(--text-primary)]">Password</h3>
    </div>
    <p class="text-xs text-[var(--text-disabled)] mt-0.5 ml-6">
      Update your account password
    </p>
  </div>
  <div class="p-6 space-y-5">
    <!-- Password status bar -->
    <div
      class="flex items-center justify-between p-4 rounded-xl bg-[var(--bg-hover)]/50 border border-[var(--border-base)]"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-xl bg-amber-500/10 flex items-center justify-center text-amber-500"
        >
          <lucide-icon name="lock" [size]="20"></lucide-icon>
        </div>
        <div>
          <p class="text-sm font-medium text-[var(--text-primary)]">Password</p>
          <p class="text-xs text-[var(--text-disabled)]">Change your account password</p>
        </div>
      </div>
      <button
        class="flex items-center gap-2 px-4 py-2 bg-[var(--bg-component)] border border-[var(--border-base)] text-[var(--text-primary)] rounded-xl text-sm font-medium hover:bg-[var(--bg-hover)] transition-all"
        (click)="showPasswordForm = !showPasswordForm"
      >
        {{ showPasswordForm ? 'Cancel' : 'Change Password' }}
      </button>
    </div>

  <!-- Change Password Form -->
  @if (showPasswordForm) {
    <form
      [formGroup]="passwordForm"
      (ngSubmit)="onChangePassword()"
      class="pt-2 space-y-4"
    >
      <app-float-label label="Current Password" [required]="true">
        <nz-input-group [nzSuffix]="currentSuffix">
          <input
            nz-input
            [type]="showCurrentPw ? 'text' : 'password'"
            formControlName="currentPassword"
            placeholder=" "
          />
        </nz-input-group>
        <ng-template #currentSuffix>
          <button
            type="button"
            aria-label="Toggle password visibility"
            class="p-1 text-[var(--text-disabled)] hover:text-[var(--text-primary)] transition-colors"
            (click)="showCurrentPw = !showCurrentPw"
          >
            <lucide-icon
              [name]="showCurrentPw ? 'eye-off' : 'eye'"
              [size]="16"
            ></lucide-icon>
          </button>
        </ng-template>
      </app-float-label>

      <app-float-label label="New Password" [required]="true">
        <nz-input-group [nzSuffix]="newSuffix">
          <input
            nz-input
            [type]="showNewPw ? 'text' : 'password'"
            formControlName="newPassword"
            placeholder=" "
          />
        </nz-input-group>
        <ng-template #newSuffix>
          <button
            type="button"
            aria-label="Toggle password visibility"
            class="p-1 text-[var(--text-disabled)] hover:text-[var(--text-primary)] transition-colors"
            (click)="showNewPw = !showNewPw"
          >
            <lucide-icon [name]="showNewPw ? 'eye-off' : 'eye'" [size]="16"></lucide-icon>
          </button>
        </ng-template>
      </app-float-label>

      <app-float-label label="Confirm New Password" [required]="true">
        <nz-input-group [nzSuffix]="confirmSuffix">
          <input
            nz-input
            [type]="showConfirmPw ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder=" "
          />
        </nz-input-group>
        <ng-template #confirmSuffix>
          <button
            type="button"
            aria-label="Toggle password visibility"
            class="p-1 text-[var(--text-disabled)] hover:text-[var(--text-primary)] transition-colors"
            (click)="showConfirmPw = !showConfirmPw"
          >
            <lucide-icon
              [name]="showConfirmPw ? 'eye-off' : 'eye'"
              [size]="16"
            ></lucide-icon>
          </button>
        </ng-template>
      </app-float-label>

      <div class="flex justify-end pt-2">
        <button
          class="flex items-center gap-2 px-5 py-2.5 bg-amber-500 text-white rounded-xl font-medium hover:opacity-90 transition-opacity shadow-lg shadow-amber-500/20 disabled:opacity-50"
          [disabled]="passwordForm.invalid || passwordLoading()"
          type="submit"
        >
          @if (passwordLoading()) {
            <lucide-icon name="refresh-cw" [size]="16" class="animate-spin"></lucide-icon>
          } @else {
            <lucide-icon name="lock" [size]="16"></lucide-icon>
          }
          <span>{{ passwordLoading() ? 'Updating...' : 'Update Password' }}</span>
        </button>
      </div>
    </form>
  }
  </div>
</div>
