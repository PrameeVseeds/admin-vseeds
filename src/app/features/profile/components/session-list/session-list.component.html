<div
  class="bg-[var(--bg-component)] rounded-2xl border border-[var(--border-base)] p-5 shadow-sm"
>
  <div class="flex items-center gap-2 mb-4">
    <lucide-icon name="monitor" [size]="16" class="text-[var(--color-primary)]"></lucide-icon>
    <h4 class="text-sm font-bold text-[var(--text-primary)]">Recent Sessions</h4>
  </div>
  <div class="space-y-3">
    @for (s of sessions; track s.id) {
      <div
        class="flex items-start gap-3 p-3 rounded-xl border border-[var(--border-base)] bg-[var(--bg-hover)]/40 group"
      >
        <div
          class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0"
          [class]="$first
            ? 'bg-emerald-500/10 text-emerald-500'
            : 'bg-[var(--bg-hover)] text-[var(--text-disabled)]'"
        >
          <lucide-icon name="globe" [size]="14"></lucide-icon>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold text-[var(--text-primary)]">
              {{ s.browser || 'Browser' }}
            </span>
            @if ($first) {
              <span
                class="px-1.5 py-0.5 text-[9px] font-bold uppercase rounded bg-emerald-500/10 text-emerald-600 border border-emerald-500/20"
              >
                Current
              </span>
            }
          </div>
          <div class="flex items-center gap-2 mt-0.5">
            <span class="text-[11px] text-[var(--text-disabled)]">{{ s.ip }}</span>
            <span class="text-[11px] text-[var(--text-disabled)]">&middot;</span>
            <span class="text-[11px] text-[var(--text-disabled)]">{{ s.timeAgo }}</span>
          </div>
        </div>
        @if (!$first) {
          <button
            class="w-7 h-7 rounded-lg flex items-center justify-center shrink-0 text-[var(--text-disabled)] opacity-0 group-hover:opacity-100 hover:bg-red-500/10 hover:text-red-500 transition-all"
            aria-label="Remove session"
            nz-tooltip
            nzTooltipTitle="Remove session"
            (click)="onRemove(s)"
          >
            <lucide-icon name="x" [size]="14"></lucide-icon>
          </button>
        }
      </div>
    } @empty {
      <p class="text-xs text-[var(--text-disabled)] text-center py-3">No recent sessions</p>
    }
  </div>
</div>
